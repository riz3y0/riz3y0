name: Update profile
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - assets/palette.json
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-panels
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Draw panels
        run: python scripts/profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit updated panels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats*.svg assets/activity*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh stats and activity'
            git push
          fi
