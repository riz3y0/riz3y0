<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">rize — vibecoder from poland</title>
  <desc id="desc">A quiet mountain valley beneath a pale moon. Warm stone ridges catch the light above a winding river. The stars slowly brighten and fade; reduced-motion settings keep them still.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141210"/>
      <stop offset=".48" stop-color="#201d1c"/>
      <stop offset="1" stop-color="#514741"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#736a5e"/>
      <stop offset=".5" stop-color="#a49984"/>
      <stop offset="1" stop-color="#d4cab4"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141210" stop-opacity="0"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <clipPath id="moon"><circle cx="1194" cy="167" r="43"/></clipPath>
    <clipPath id="water"><path d="M873 637L842 674 915 699 815 734 869 768 672 810 754 860H444L582 802 756 756 724 727 841 696 813 672Z"/></clipPath>
  </defs>
