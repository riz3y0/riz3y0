<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0a16"/>
      <stop offset="55%" stop-color="#181233"/>
      <stop offset="100%" stop-color="#2a1e5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#7c5ce0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0c0a16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f2ff"/>
      <stop offset="100%" stop-color="#c9c3ef"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="460" fill="url(#sky)"/>

  <!-- star field -->
  <g fill="#e9e4ff">
    <circle cx="120" cy="52" r="1.6"/><circle cx="205" cy="140" r="1.1"/>
    <circle cx="330" cy="70" r="1.8"/><circle cx="462" cy="118" r="1.2"/>
    <circle cx="560" cy="44" r="1.5"/><circle cx="690" cy="96" r="1.1"/>
    <circle cx="815" cy="38" r="1.7"/><circle cx="948" cy="88" r="1.2"/>
    <circle cx="1075" cy="54" r="1.6"/><circle cx="1180" cy="132" r="1.1"/>
    <circle cx="1298" cy="66" r="1.5"/><circle cx="1418" cy="112" r="1.2"/>
    <circle cx="1500" cy="42" r="1.7"/><circle cx="55" cy="180" r="1.0"/>
    <circle cx="258" cy="198" r="1.3"/><circle cx="630" cy="170" r="1.0"/>
    <circle cx="1010" cy="184" r="1.3"/><circle cx="1352" cy="186" r="1.0"/>
    <circle cx="1552" cy="174" r="1.3"/><circle cx="886" cy="150" r="1.0"/>
  </g>
  <g stroke="#e9e4ff" stroke-width="1.4">
    <path d="M 730 95 h 12 M 736 89 v 12"/>
    <path d="M 350 60 h 10 M 355 55 v 10"/>
    <path d="M 1240 70 h 10 M 1245 65 v 10"/>
  </g>

  <!-- faceted moon -->
  <g transform="translate(800,86) scale(0.5)">
    <path d="M 0 -88 L 62 -50 L 62 50 L 0 88 L -62 50 L -62 -50 Z" fill="#2a1e5c" stroke="#a78bfa" stroke-width="3"/>
    <path d="M 0 -88 L 62 -50 L 0 -10 L -62 -50 Z" fill="#8b7cf0" opacity="0.85"/>
    <path d="M -62 -50 L 0 -10 L 0 60 L -62 50 Z" fill="#4c3a8a" opacity="0.9"/>
    <path d="M 62 -50 L 62 50 L 0 60 L 0 -10 Z" fill="#a78bfa" opacity="0.45"/>
    <path d="M 0 88 L 62 50 L 0 60 L -62 50 Z" fill="#3b2c72" opacity="0.9"/>
  </g>

  <!-- wordmark glow -->
  <ellipse cx="800" cy="210" rx="560" ry="150" fill="url(#glow)"/>

  <!-- layered ridges -->
  <g stroke-linejoin="miter">
    <path d="M 0 360 L 180 300 L 320 372 L 470 292 L 640 380 L 830 306 L 1010 384 L 1180 300 L 1330 372 L 1600 310 L 1600 460 L 0 460 Z" fill="#3b2c72" opacity="0.55"/>
    <path d="M 0 392 L 220 328 L 400 396 L 600 330 L 800 402 L 1000 334 L 1200 400 L 1400 334 L 1600 396 L 1600 460 L 0 460 Z" fill="#2a1e5c" opacity="0.9"/>
    <path d="M 0 424 L 260 376 L 480 430 L 720 380 L 960 432 L 1200 384 L 1440 430 L 1600 396 L 1600 460 L 0 460 Z" fill="#181233"/>
    <path d="M 0 448 L 320 418 L 640 452 L 960 420 L 1280 452 L 1600 424 L 1600 460 L 0 460 Z" fill="#0c0a16"/>
  </g>
  <ellipse cx="800" cy="440" rx="80" ry="14" fill="#a78bfa" opacity="0.12"/>

  <!-- wordmark (text, centered — renders with any monospace the viewer has) -->
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-weight="700" text-anchor="middle">
    <text x="800" y="240" font-size="118" letter-spacing="16" fill="url(#ink)" filter="url(#soft)" opacity="0.35">riz3y0</text>
    <text x="800" y="240" font-size="118" letter-spacing="16" fill="url(#ink)">riz3y0</text>
    <text x="802" y="300" font-size="21" letter-spacing="8" fill="#a78bfa" opacity="0.9">// vibecoder from poland</text>
  </g>
</svg>
