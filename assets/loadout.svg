<title id="t">loadout</title><desc id="d">An 8-bit inventory. Main: Rust, shown as a coral crab snapping its claws, and Go, shown as a blue gopher that blinks. Also: game cartridges labelled C, C++, Zig, Python and TypeScript. Rig: a pixel monitor with niri scrolling columns and a terminal; CachyOS, niri, Vesper (my own shell), foot, fish, yazi, neovim and zed.</desc>
